      - { block: "minecraft:dropper[facing=down]", at: [5.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [5, 1, 26], to: [6, 3, 27] }

  # ---------------------------------------------------------------------------------------------------------------
  # Upgraders: arches over the belt on the iron footings. Every item passes both.
  # ---------------------------------------------------------------------------------------------------------------
  washer:
    type: upgrader
    name: Washer
    price: 3000
    requires: [iron-dropper]
    pad: [31, 1, 37]
    at: { belt: main-belt, waypoint: 1 }      # x 31
    multiplier: 1.5
    particle: SPLASH
    sound: entity.generic.splash
    barriers: [[31, 1, 28], [31, 2, 28], [31, 3, 28], [31, 1, 32], [31, 2, 32], [31, 3, 32]]

  smelter:
    type: upgrader
    name: Smelter
    price: 60000
    requires: [redstone-dropper]
    pad: [33, 1, 37]
    at: { belt: main-belt, waypoint: 2 }      # x 33
    multiplier: 2
    particle: FLAME
    sound: block.furnace.fire_crackle
    barriers: [[33, 1, 28], [33, 2, 28], [33, 3, 28], [33, 1, 32], [33, 2, 32], [33, 3, 32]]

  # ---------------------------------------------------------------------------------------------------------------
  # Decoration
  # ---------------------------------------------------------------------------------------------------------------
  garden-hedge:
    type: wall
    name: Garden Hedge
    price: 2500
    requires: [gold-dropper]
    pad: [37, 1, 37]
    parts:                     # along the free floor west of the vault
      - { block: "minecraft:flowering_azalea_leaves[persistent=true]", at: [2, 1, 2], size: [3, 1, 1] }
      - { block: "minecraft:azalea_leaves[persistent=true]", at: [5, 1, 2], size: [3, 1, 1] }
      - { block: "minecraft:flowering_azalea_leaves[persistent=true]", at: [8, 1, 2], size: [3, 1, 1] }
    barriers:
      - { from: [2, 1, 2], to: [10, 1, 2] }

  # ---------------------------------------------------------------------------------------------------------------
  # The rebirth vault: kept through rebirths
  # ---------------------------------------------------------------------------------------------------------------
  super-dropper:
    type: dropper
    name: Super Dropper
    zone: vault
    min-rebirths: 1
    price: 5000000
    pad: [16, 1, 10]           # inside the vault, south of its belt
    spout: [16, 2, 8]
    interval: 40
    value: 10000
    item: { display: block, material: AMETHYST_BLOCK, scale: 0.4 }
    route: { belt: vault-belt, waypoint: 1 }
    parts:
      - { block: "minecraft:amethyst_block", at: [16, 1, 5], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [16.25, 3.25, 6.9], size: [0.5, 0.5, 1.35] }
