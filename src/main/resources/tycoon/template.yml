# The tycoon plot template: what the plugin adds to each plot of the map. Every position is [x, dy, z] from the plot's
# origin (its minimum x/z corner at ground level): dy 0 is the floor block, players stand at dy 1. Money is in dollars.
#
# Laid out on the map's plot (41 x 45): the main belt bed runs east along z 30 from x 4 to the collector house at
# x 35; nine dropper footings sit north of it at x 29, 26, ..., 5 (z 26-27) with pad sockets south of it at z 34;
# two upgrader footings straddle it at x 31 and 33; the rebirth vault is at x 12-28, z 2-12.
#
# Tiers go cheapest first from the collector end: Wooden at x 29, Netherite at x 5. Each tier's belt stretch carries
# its items east onto the stretch before it, so a tier needs its stretch, and that stretch needs the tier before.
schema: 2

# The plot's footprint (x 0-40, z 0-44) and the height above the floor it uses.
size: [41, 22, 45]

base:
  spawn: [20, 1, 40]           # centre of the plot-coloured spawn pad
  spawn-yaw: 180               # 180 faces north, toward the belt
  collectors:
    main: [35, 0, 30]          # items are cashed in on top of this bed block, just inside the collector house
    vault: [24, 0, 8]          # the end of the vault bed, just before the vault hopper
  belts:
    vault-belt:                # part of the vault: free, and kept through rebirths
      speed: 2
      path: [[14, 0, 8], [16, 0, 8], [23, 0, 8]]
      collector: vault
  rebirth-pad: [34, 1, 40]     # on the gold pad's crying obsidian
  gate-label:                  # the plot's name sign: on the road side of the gate, just above the arch
    at: [20, 5, 44]            # just above the arch block in the middle of the gate
    front: south               # the road side; the sign stands just off this face
  vault:
    door: [[19, 1, 12], [21, 3, 12]]   # the 3x3 doorway: sealed with barriers until the owner has enough rebirths
    unlock-rebirths: 1
  manual:                      # the Ore Vein: click it (left or right) to mine money by hand; how every run starts out
    name: Ore Vein
    at: [26, 1, 40]            # beside the spawn pad
    parts:
      - { block: "minecraft:deepslate_gold_ore", at: [26, 1, 40] }
      - { block: "minecraft:deepslate_gold_ore", at: [26.2, 2, 40.2], size: [0.6, 0.6, 0.6] }
    value: 0.10                # dollars a click, before any pickaxe
    max-clicks-per-second: 8   # clicks past this don't count (so an autoclicker can't beat a quick hand)
    extra:                     # More Miners!: one on each corner dot of polished andesite, each just like the main one
      - [4, 1, 4]
      - [36, 1, 4]
      - [4, 1, 40]
      - [36, 1, 40]
    upgrades:                  # each pickaxe level: price, and dollars a click (8x the level before)
      name: Pickaxe
      pad: [24, 1, 40]
      levels:
        - { price: 69, value: 0.80 }
        - { price: 1100, value: 6.40 }
        - { price: 28000, value: 51 }
        - { price: 730000, value: 410 }
        - { price: 38000000, value: 3300 }
        - { price: 970000000, value: 26000 }
        - { price: 24000000000, value: 210000 }
        - { price: 1200000000000, value: 1700000 }
        - { price: 1200000000000, value: 13000000 }
  belt-speed:                  # makes items (and the belt surface) move faster
    name: Belt Speed
    pad: [29, 1, 37]
    levels:                    # each level: price, and how many times the belts' own speed
      - { price: 3200, speed: 1.5 }
      - { price: 1000000, speed: 2 }
      - { price: 43000000, speed: 2.75 }
      - { price: 1100000000, speed: 3.5 }
      - { price: 26000000000, speed: 4.5 }
  star-shower:                 # nether stars fall onto the open floor; walk over them to collect their worth
    name: Star Shower
    pad: [17, 1, 38]
    cap: 500                   # most stars lying on a plot at once (they never despawn)
    drop-height: 14
    areas:                     # where they land: the open floor, never the vault, droppers, belts, walls or collector
      - { from: [1, 1, 13], to: [39, 1, 24] }    # between the vault and the dropper row
      - { from: [1, 1, 35], to: [39, 1, 42] }    # the strip by the spawn
      - { from: [1, 1, 2], to: [10, 1, 11] }     # west of the vault
      - { from: [30, 1, 2], to: [38, 1, 11] }    # east of the vault
    # Each level roughly pays itself back by the time you'd buy the next one, picking up about half the stars.
    levels:                    # price, dollars a star, seconds between stars: many stars, each worth a little
      - { price: 150, value: 0.37, every: 1.0 }
      - { price: 39000, value: 36.62, every: 0.8 }
      - { price: 15000000, value: 12000, every: 0.6 }
      - { price: 360000000, value: 203000, every: 0.5 }
      - { price: 8300000000, value: 3249000, every: 0.4 }
  gate-lasers:                 # where the Gate Lasers go once bought: across the gate, with a lever just inside it
    from: [17, 1, 44]
    to: [23, 3, 44]
    lever: [16, 2, 43]         # on the gate's arch post (the block south of it), just inside the gate
    lever-facing: north
  beds:                        # the map's belt beds (black concrete, flush with the floor): every belt runs on these
    - { from: [4, 0, 30], to: [35, 0, 30] }    # main belt, into the collector house
    - { from: [14, 0, 8], to: [24, 0, 8] }     # vault belt
  trophies:                    # on top of the five quartz pedestals
    slot-1: [14, 2, 3]
    slot-2: [17, 2, 3]
    slot-3: [20, 2, 3]
    slot-4: [23, 2, 3]
    slot-5: [26, 2, 3]

# What every run starts with (no pad, nothing to pay).
start-with: [main-belt, wooden-dropper]

components:
  # ---------------------------------------------------------------------------------------------------------------
  # The main belt: the first stretch (x 29 to the collector) comes with the plot; each tier adds the 3 blocks west.
  # ---------------------------------------------------------------------------------------------------------------
  main-belt:
    type: conveyor
    name: Main Belt
    speed: 2                   # blocks per second; items ride on top of the bed (dy 1) going east
    path: [[29, 0, 30], [31, 0, 30], [33, 0, 30], [34, 0, 30]]   # waypoints 1 and 2 are the two upgrader arches
    collector: main


  # Wooden (footing x 29-30)
  wooden-dropper:
    type: dropper
    name: Wooden Dropper
    requires: [main-belt]
    spout: [29, 2, 30]
    interval: 40
    value: 0.2
    item: { display: item, material: COAL, scale: 0.5 }
    route: { belt: main-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:oak_planks", at: [29, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [29.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [29.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [29, 1, 26], to: [30, 3, 27] }

  # Copper (footing x 26-27)
  copper-belt:
    type: conveyor
    name: Copper Belt
    price: 100
    requires: [wooden-dropper]
    pad: [26, 1, 37]
    speed: 2
    path: [[26, 0, 30], [28, 0, 30]]
    merge: { belt: main-belt, waypoint: 0 }
  copper-dropper:
    type: dropper
    name: Copper Dropper
    price: 100
    requires: [copper-belt]
    pad: [26, 1, 34]           # on the socket
    spout: [26, 2, 30]
    interval: 100
    value: 2
    item: { display: item, material: RAW_COPPER, scale: 0.5 }
    route: { belt: copper-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:copper_block", at: [26, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [26.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [26.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
