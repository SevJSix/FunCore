# The tycoon plot template: what the plugin adds to each plot of the map. Every position is [x, dy, z] from the plot's
# origin (its minimum x/z corner at ground level): dy 0 is the floor block, players stand at dy 1. Money is in dollars.
#
# Laid out on the map's plot (41 x 45): the main belt bed runs east along z 30 from x 4 to the collector house at
# x 35; nine dropper footings sit north of it at x 29, 26, ..., 5 (z 26-27) with pad sockets south of it at z 34;
# two upgrader footings straddle it at x 31 and 33; the rebirth vault is at x 12-28, z 2-12.
#
# Tiers go cheapest first from the collector end: Wooden at x 29, Netherite at x 5. Each tier's belt stretch carries
# its items east onto the stretch before it, so a tier needs its stretch, and that stretch needs the tier before.
schema: 2

# The plot's footprint (x 0-40, z 0-44) and the height above the floor it uses.
size: [41, 22, 45]

base:
  spawn: [20, 1, 40]           # centre of the plot-coloured spawn pad
  spawn-yaw: 180               # 180 faces north, toward the belt
  collectors:
    main: [35, 0, 30]          # items are cashed in on top of this bed block, just inside the collector house
    vault: [24, 0, 8]          # the end of the vault bed, just before the vault hopper
  belts:
    vault-belt:                # part of the vault: free, and kept through rebirths
      speed: 2
      path: [[14, 0, 8], [16, 0, 8], [23, 0, 8]]
      collector: vault
  rebirth-pad: [34, 1, 40]     # on the gold pad's crying obsidian
  vault:
    door: [[19, 1, 12], [21, 3, 12]]   # the 3x3 doorway: sealed with barriers until the owner has enough rebirths
    unlock-rebirths: 1
  trophies:                    # on top of the five quartz pedestals
    slot-1: [14, 2, 3]
    slot-2: [17, 2, 3]
    slot-3: [20, 2, 3]
    slot-4: [23, 2, 3]
    slot-5: [26, 2, 3]

# What every run starts with (no pad, nothing to pay).
start-with: [main-belt, wooden-dropper]

components:
  # ---------------------------------------------------------------------------------------------------------------
  # The main belt: the first stretch (x 29 to the collector) comes with the plot; each tier adds the 3 blocks west.
  # ---------------------------------------------------------------------------------------------------------------
  main-belt:
    type: conveyor
    name: Main Belt
    speed: 2                   # blocks per second; items ride on top of the bed (dy 1) going east
    path: [[29, 0, 30], [31, 0, 30], [33, 0, 30], [34, 0, 30]]   # waypoints 1 and 2 are the two upgrader arches
    collector: main


  # Wooden (footing x 29-30)
  wooden-dropper:
    type: dropper
    name: Wooden Dropper
    requires: [main-belt]
    spout: [29, 2, 30]
    interval: 40
    value: 1
    item: { display: item, material: COAL, scale: 0.5 }
    route: { belt: main-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:oak_planks", at: [29, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [29.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [29.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [29, 1, 26], to: [30, 3, 27] }

  # Copper (footing x 26-27)
  copper-belt:
    type: conveyor
    name: Copper Belt
    price: 60
    requires: [wooden-dropper]
    pad: [26, 1, 37]
    speed: 2
    path: [[26, 0, 30], [28, 0, 30]]
    merge: { belt: main-belt, waypoint: 0 }
  copper-dropper:
    type: dropper
    name: Copper Dropper
    price: 240
    requires: [copper-belt]
    pad: [26, 1, 34]           # on the socket
    spout: [26, 2, 30]
    interval: 40
    value: 4
    item: { display: item, material: RAW_COPPER, scale: 0.5 }
    route: { belt: copper-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:copper_block", at: [26, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [26.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [26.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [26, 1, 26], to: [27, 3, 27] }

  # Iron (footing x 23-24)
  iron-belt:
    type: conveyor
    name: Iron Belt
    price: 270
    requires: [copper-dropper]
    pad: [23, 1, 37]
    speed: 2
    path: [[23, 0, 30], [25, 0, 30]]
    merge: { belt: copper-belt, waypoint: 0 }
  iron-dropper:
    type: dropper
    name: Iron Dropper
    price: 1080
    requires: [iron-belt]
    pad: [23, 1, 34]           # on the socket
    spout: [23, 2, 30]
    interval: 40
    value: 12
    item: { display: item, material: RAW_IRON, scale: 0.5 }
    route: { belt: iron-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:iron_block", at: [23, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [23.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [23.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [23, 1, 26], to: [24, 3, 27] }

  # Gold (footing x 20-21)
  gold-belt:
    type: conveyor
    name: Gold Belt
    price: 1200
    requires: [iron-dropper]
    pad: [20, 1, 37]
    speed: 2
    path: [[20, 0, 30], [22, 0, 30]]
    merge: { belt: iron-belt, waypoint: 0 }
  gold-dropper:
    type: dropper
    name: Gold Dropper
    price: 4800
    requires: [gold-belt]
    pad: [20, 1, 34]           # on the socket
    spout: [20, 2, 30]
    interval: 40
    value: 40
    item: { display: item, material: RAW_GOLD, scale: 0.5 }
    route: { belt: gold-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:gold_block", at: [20, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [20.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [20.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [20, 1, 26], to: [21, 3, 27] }

  # Redstone (footing x 17-18)
  redstone-belt:
    type: conveyor
    name: Redstone Belt
    price: 5400
    requires: [gold-dropper]
    pad: [17, 1, 37]
    speed: 2
    path: [[17, 0, 30], [19, 0, 30]]
    merge: { belt: gold-belt, waypoint: 0 }
  redstone-dropper:
    type: dropper
    name: Redstone Dropper
    price: 21600
    requires: [redstone-belt]
    pad: [17, 1, 34]           # on the socket
    spout: [17, 2, 30]
    interval: 40
    value: 120
    item: { display: item, material: REDSTONE, scale: 0.5 }
    route: { belt: redstone-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:redstone_block", at: [17, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [17.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [17.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [17, 1, 26], to: [18, 3, 27] }

  # Lapis (footing x 14-15)
  lapis-belt:
    type: conveyor
    name: Lapis Belt
    price: 24000
    requires: [redstone-dropper]
    pad: [14, 1, 37]
    speed: 2
    path: [[14, 0, 30], [16, 0, 30]]
    merge: { belt: redstone-belt, waypoint: 0 }
  lapis-dropper:
    type: dropper
    name: Lapis Dropper
    price: 96000
    requires: [lapis-belt]
    pad: [14, 1, 34]           # on the socket
    spout: [14, 2, 30]
    interval: 40
    value: 400
    item: { display: item, material: LAPIS_LAZULI, scale: 0.5 }
    route: { belt: lapis-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:lapis_block", at: [14, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [14.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [14.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
    barriers:
      - { from: [14, 1, 26], to: [15, 3, 27] }

  # Diamond (footing x 11-12)
  diamond-belt:
    type: conveyor
    name: Diamond Belt
    price: 112500
    requires: [lapis-dropper]
    pad: [11, 1, 37]
    speed: 2
    path: [[11, 0, 30], [13, 0, 30]]
    merge: { belt: lapis-belt, waypoint: 0 }
  diamond-dropper:
    type: dropper
    name: Diamond Dropper
    price: 450000
    requires: [diamond-belt]
    pad: [11, 1, 34]           # on the socket
    spout: [11, 2, 30]
    interval: 40
    value: 1500
    item: { display: item, material: DIAMOND, scale: 0.5 }
    route: { belt: diamond-belt, waypoint: 0 }
    parts:
      - { block: "minecraft:diamond_block", at: [11, 1, 26], size: [2, 3, 2] }
      - { block: "minecraft:polished_blackstone", at: [11.25, 3.25, 27.9], size: [0.5, 0.5, 2.35] }
      - { block: "minecraft:dropper[facing=down]", at: [11.125, 3.0, 30.125], size: [0.75, 0.75, 0.75] }
