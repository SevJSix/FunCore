name: FunCore
description: $description
version: '${version}'

main: me.sevj6.funCore.FunCore
api-version: '26.3'
load: POSTWORLD

authors: [ SevJ6 ]

# Optional: lets /arena use WorldEdit wand selections (FAWE also registers itself as WorldEdit).
softdepend: [ FastAsyncWorldEdit, WorldEdit ]

permissions:
  funcore.command.game:
    description: Use /game to list, join and leave minigames.
    default: true
  funcore.command.game.admin:
    description: Use /game start and /game stop.
    default: op
  funcore.command.arena:
    description: Use /arena to set up minigame arenas.
    default: op
  funcore.command.npc:
    description: Use /npc to create, edit, save and load NPCs.
    default: op
  funcore.command.balance:
    description: Use /balance to see your own balance.
    default: true
  funcore.command.balance.others:
    description: Use /balance <player> to see anyone's balance.
    default: op
  funcore.command.pay:
    description: Use /pay to send cash to other players.
    default: true
  funcore.command.baltop:
    description: Use /baltop to see the richest players.
    default: true
  funcore.command.eco:
    description: Use /eco to give, take, set and reset balances.
    default: op
  funcore.command.setspawn:
    description: Use /setspawn to set the server spawn.
    default: op
  funcore.command.menutest:
    description: TEMPORARY - use /menutest to try out the menu framework.
    default: op
